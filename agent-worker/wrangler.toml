name = "studio-agent-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Sandbox binding
[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_classes = ["Sandbox"]

[[migrations]]
tag = "v2"
deleted_classes = ["Sandbox"]

# Container definition for Sandbox
[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 10

# Environment variables (set via wrangler secret)
# ANTHROPIC_API_KEY
# AGENT_WORKER_SHARED_SECRET
